services:
  backend:
    restart: unless-stopped
    image: zoltus/example-backend
    ports:
      - "8080:8080"
    environment:
      - REDIS_HOST=redis
      - REQUEST_ORIGIN=http://localhost:5001
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST=postgres
      - POSTGRES_DATABASE=postgres
  frontend:
    image: zoltus/example-frontend
    ports:
      - "5001:5001"

  redis:
    image: redis
    
  postgres:
    image: postgres:18
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres