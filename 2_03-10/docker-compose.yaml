services:
  backend:
    image: zoltus/example-backend
    environment:
      - REDIS_HOST=redis
      - REQUEST_ORIGIN=http://localhost:8000
      - POSTGRES_HOST=db
      - POSTGRES_PASSWORD=example
  frontend:
    image: zoltus/example-frontend

  redis:
    image: redis
    
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=example
    volumes:
      - ./database:/var/lib/postgresql
      
  nginx:
    image: nginx
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
